models:
  - task: "yolo"
    name: "hd2-fp16"
    version: "kV11"
    files:
      model: "assets/hd2-yolo11n-fp16.onnx"
  - task: "yolo"
    name: "hd2-fp32"
    version: "kV11"
    files:
      model: "assets/hd2-yolo11n-fp32.onnx"
  - task: "ocr"
    name: "ppocr-v4"
    version: "kPPOCRv4"
    files:
      det: "assets/ppocr_det.onnx"
      rec: "assets/ppocr_rec.onnx"
      dictionary: "assets/ppocr_keys_v1.txt"
    # Optional model-construction controls (also supported in legacy ocr entries).
    # Omit or use null to retain defaults; {} explicitly selects defaults.
    # Integer ranges: kernel_size 1..32, dilation_iterations 0..8,
    # min_box_area 0..1048576 (strict pre-unclip bounding-box area > value).
    # ocr_detection:
    #   kernel_size: 2
    #   dilation_iterations: 3
    #   min_box_area: 64
