name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-context:
    name: Prepare release context
    runs-on: ubuntu-24.04
    outputs:
      release_date: ${{ steps.release.outputs.release_date }}
      release_time: ${{ steps.release.outputs.release_time }}
      release_timestamp: ${{ steps.release.outputs.release_timestamp }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Generate release identifiers
        id: release
        run: |
          timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          release_date="${timestamp:0:4}${timestamp:5:2}${timestamp:8:2}"
          release_time="${timestamp:11:2}${timestamp:14:2}"
          release_tag="build-${release_date}-${release_time}-${GITHUB_SHA:0:8}-r${GITHUB_RUN_ATTEMPT}"
          {
            printf 'release_date=%s\n' "$release_date"
            printf 'release_time=%s\n' "$release_time"
            printf 'release_timestamp=%s\n' "$timestamp"
            printf 'release_tag=%s\n' "$release_tag"
          } >> "$GITHUB_OUTPUT"

  build-and-test:
    name: ${{ matrix.name }}
    needs: release-context
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - name: Linux x86_64 / GCC 14 / Release
            os: ubuntu-24.04
            cache_key: linux-x86_64-gcc14-release
            package_key: linux-x86_64-gcc14-release-cpu
            policy: build.ccache:y
            apt_packages: g++-14 libopencv-dev iproute2 python3-dev python3-pip python3-setuptools python3-wheel
            configure: -p linux -a x86_64 --toolchain=gcc --cc=gcc-14 --cxx=g++-14 -m release --with_cuda=n --with_tensorrt=n --with_rknpu=n
            build_tests: true
            run_http: true
            verify_pattern: ''
            publish: true
            release_platform: linux
            release_arch: x86_64
            release_variant: gcc14-cpu

          - name: Linux x86_64 / Clang 18 / Release
            os: ubuntu-24.04
            xmake_version: '3.1.1'
            cache_key: linux-x86_64-clang18-libcxx-release
            package_key: linux-x86_64-clang18-libcxx-cpu
            policy: build.ccache:y
            apt_packages: clang-18 libc++-18-dev libc++abi-18-dev libopencv-dev iproute2 python3-dev python3-pip python3-setuptools python3-wheel
            configure: -p linux -a x86_64 --toolchain=clang --cc=clang-18 --cxx=clang++-18 -m release --runtimes=c++_shared --with_cuda=n --with_tensorrt=n --with_rknpu=n
            build_tests: true
            run_http: false
            verify_pattern: ''
            publish: false

          - name: Linux x86_64 / GCC 14 / ASan + UBSan
            os: ubuntu-24.04
            cache_key: linux-x86_64-gcc14-asan-ubsan
            package_key: linux-x86_64-gcc14-asan-ubsan
            policy: build.ccache:y,build.sanitizer.address:y,build.sanitizer.undefined:y
            apt_packages: g++-14 libopencv-dev iproute2 python3-dev python3-pip python3-setuptools python3-wheel
            configure: -p linux -a x86_64 --toolchain=gcc --cc=gcc-14 --cxx=g++-14 -m release --with_cuda=n --with_tensorrt=n --with_rknpu=n
            build_tests: true
            run_http: false
            verify_pattern: ''
            publish: false

          - name: Windows x64 / MSVC / Release
            os: windows-2022
            cache_key: windows-x64-msvc-release
            package_key: windows-x64-msvc-cpu
            policy: build.ccache:y
            apt_packages: ''
            configure: -p windows -a x64 --toolchain=msvc -m release --runtimes=MD --with_dml=n --with_cuda=n --with_tensorrt=n
            build_tests: true
            run_http: true
            verify_pattern: ''
            publish: true
            release_platform: windows
            release_arch: x64
            release_variant: msvc-cpu

          - name: Windows x64 / MSVC / DirectML
            os: windows-2022
            cache_key: windows-x64-msvc-directml
            package_key: windows-x64-msvc-directml
            policy: build.ccache:y
            apt_packages: ''
            configure: -p windows -a x64 --toolchain=msvc -m release --runtimes=MD --with_dml=y --with_cuda=n --with_tensorrt=n
            build_tests: true
            run_http: false
            verify_pattern: ''
            publish: true
            release_platform: windows-directml
            release_arch: x64
            release_variant: msvc-directml


          - name: Linux ARM64 / GCC cross-build
            os: ubuntu-24.04
            cache_key: linux-arm64-gcc-cross
            package_key: linux-arm64-gcc-cross
            policy: build.ccache:y
            apt_packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu python3-dev python3-numpy python3-pip python3-setuptools python3-wheel
            configure: -p linux -a arm64 --cross=aarch64-linux-gnu- -k binary -m release --runtimes=stdc++_static --with_cuda=n --with_tensorrt=n --with_rknpu=n
            build_tests: false
            run_http: false
            verify_pattern: ARM aarch64
            publish: true
            release_platform: linux
            release_arch: arm64
            release_variant: gcc-cpu

          - name: Linux ARM64 / GCC cross-build / RKNPU
            os: ubuntu-24.04
            cache_key: linux-arm64-gcc-cross-rknpu
            package_key: linux-arm64-gcc-cross-rknpu
            policy: build.ccache:y
            apt_packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu python3-dev python3-numpy python3-pip python3-setuptools python3-wheel
            configure: -p linux -a arm64 --cross=aarch64-linux-gnu- -k binary -m release --runtimes=stdc++_static --with_cuda=n --with_tensorrt=n --with_rknpu=y
            build_tests: false
            run_http: false
            verify_pattern: ARM aarch64
            publish: true
            release_platform: linux-rknpu
            release_arch: arm64
            release_variant: gcc-rknpu

          - name: Linux ARMv7 / GCC cross-build
            os: ubuntu-24.04
            cache_key: linux-armv7-gcc-cross
            package_key: linux-armv7-gcc-cross
            policy: build.ccache:y
            apt_packages: gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf python3-dev python3-numpy python3-pip python3-setuptools python3-wheel
            configure: -p linux -a arm --cross=arm-linux-gnueabihf- -k binary -m release --runtimes=stdc++_static --with_cuda=n --with_tensorrt=n --with_rknpu=n
            build_tests: false
            run_http: false
            verify_pattern: ARM
            publish: true
            release_platform: linux
            release_arch: armv7
            release_variant: gcc-cpu

          - name: Linux RISC-V 64 / GCC cross-build
            os: ubuntu-24.04
            cache_key: linux-riscv64-gcc-cross
            package_key: linux-riscv64-gcc-cross
            policy: build.ccache:y
            apt_packages: gcc-riscv64-linux-gnu g++-riscv64-linux-gnu python3-dev python3-numpy python3-pip python3-setuptools python3-wheel
            configure: -p linux -a riscv64 --cross=riscv64-linux-gnu- -k binary -m release --runtimes=stdc++_static --with_cuda=n --with_tensorrt=n --with_rknpu=n
            build_tests: false
            run_http: false
            verify_pattern: RISC-V
            publish: true
            release_platform: linux
            release_arch: riscv64
            release_variant: gcc-cpu

    defaults:
      run:
        shell: bash

    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      XMAKE_ROOT: y

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
          lfs: ${{ matrix.build_tests }}

      - name: Test release tooling
        if: matrix.cache_key == 'linux-x86_64-gcc14-release'
        run: python scripts/test_release_artifacts.py

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a # v1
        with:
          xmake-version: ${{ matrix.xmake_version || '2.9.7' }}
          actions-cache-folder: .xmake-tool-cache
          actions-cache-key: xmake-${{ matrix.xmake_version || '2.9.7' }}

      - name: Resolve xmake package path
        id: package-path
        run: |
          package_path="$(xmake l -c 'import("core.package.package"); io.write(package.installdir())')"
          printf 'path=%s\n' "$package_path" >> "$GITHUB_OUTPUT"

      - name: Restore package cache
        id: package-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.package-path.outputs.path }}
          key: xmake-package-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.package_key }}-xmake-${{ matrix.xmake_version || '2.9.7' }}--${{ hashFiles('xmake.lua', 'xmake/**/*.lua', 'app/**/xmake.lua') }}
          restore-keys: |
            xmake-package-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.package_key }}-xmake-${{ matrix.xmake_version || '2.9.7' }}--

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/.build_cache
          key: xmake-build-v2-${{ matrix.cache_key }}--${{ hashFiles('xmake.lua', 'xmake/**/*.lua', 'app/**/xmake.lua', 'app/source/**/*.c', 'app/source/**/*.cpp', 'app/source/**/*.h', 'app/source/**/*.hpp') }}
          restore-keys: |
            xmake-build-v2-${{ matrix.cache_key }}--

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ${{ matrix.apt_packages }}

      - name: Configure
        run: xmake f ${{ matrix.configure }} --policies=${{ matrix.policy }} -y

      - name: Build server
        run: xmake build server || xmake build -vD server

      - name: Build unit tests
        if: matrix.build_tests
        run: |
          xmake build test_vision_helper
          xmake build test_cvt
          xmake build test_common
          xmake build test_yolo_postprocess
          xmake build test_ocr_decode
          xmake build test_infer_inputs

      - name: Run unit tests
        if: matrix.build_tests
        run: |
          xmake run test_vision_helper
          xmake run test_cvt
          xmake run test_common
          xmake run test_yolo_postprocess
          xmake run test_ocr_decode
          xmake run test_infer_inputs --project-root "$GITHUB_WORKSPACE"

      - name: Run real-server HTTP and startup regression
        if: matrix.run_http
        run: |
          server="$(xmake lua -q -c "import('core.project.config'); config.load(); import('core.project.project'); io.write(path.absolute(project.target('server'):targetfile()))")"
          python scripts/test_http_regression.py --server "$server" --project-root "$GITHUB_WORKSPACE"

      - name: Verify cross-built server architecture
        if: matrix.verify_pattern != ''
        run: |
          server="$(xmake lua -q -c "import('core.project.config'); config.load(); import('core.project.project'); io.write(path.absolute(project.target('server'):targetfile()))")"
          description="$(file "$server")"
          printf '%s\n' "$description"
          case "$description" in
            *"${{ matrix.verify_pattern }}"*) ;;
            *) printf 'Expected architecture marker: %s\n' "${{ matrix.verify_pattern }}" >&2; exit 1 ;;
          esac

      - name: Package release artifacts
        if: matrix.publish && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          ARCHIVE_NAME: vision_simple-${{ matrix.release_platform }}-${{ matrix.release_arch }}-${{ needs.release-context.outputs.release_date }}-${{ needs.release-context.outputs.release_time }}-UTF8.zip
          BUILD_NAME: ${{ matrix.name }}
          CONFIGURE_ARGS: ${{ matrix.configure }}
          RELEASE_ARCH: ${{ matrix.release_arch }}
          RELEASE_PLATFORM: ${{ matrix.release_platform }}
          RELEASE_TIMESTAMP: ${{ needs.release-context.outputs.release_timestamp }}
          RELEASE_VARIANT: ${{ matrix.release_variant }}
          XMAKE_VERSION: ${{ matrix.xmake_version || '2.9.7' }}
        run: |
          server="$(xmake lua -q -c "import('core.project.config'); config.load(); import('core.project.project'); io.write(path.absolute(project.target('server'):targetfile()))")"
          runtime="$(xmake lua -q -c "import('core.project.config'); config.load(); import('core.project.project'); io.write(path.absolute(project.target('runtime'):targetfile()))")"
          python scripts/release_artifacts.py pack \
            --server "$server" \
            --runtime "$runtime" \
            --output "$GITHUB_WORKSPACE/release-assets/$ARCHIVE_NAME" \
            --platform "$RELEASE_PLATFORM" \
            --arch "$RELEASE_ARCH" \
            --variant "$RELEASE_VARIANT" \
            --commit "$GITHUB_SHA" \
            --timestamp "$RELEASE_TIMESTAMP" \
            --build-name "$BUILD_NAME" \
            --xmake-version "$XMAKE_VERSION" \
            --configure "$CONFIGURE_ARGS"

      - name: Upload release archive
        if: matrix.publish && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: release-assets/vision_simple-${{ matrix.release_platform }}-${{ matrix.release_arch }}-${{ needs.release-context.outputs.release_date }}-${{ needs.release-context.outputs.release_time }}-UTF8.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Save package cache
        if: github.event_name != 'pull_request' && success() && steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.package-path.outputs.path }}
          key: ${{ steps.package-cache.outputs.cache-primary-key }}

      - name: Save compiler cache
        if: github.event_name != 'pull_request' && success() && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/.build_cache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Report cache restoration
        if: always()
        env:
          MATRIX_NAME: ${{ matrix.name }}
          PACKAGE_HIT: ${{ steps.package-cache.outputs.cache-hit }}
          PACKAGE_MATCHED: ${{ steps.package-cache.outputs.cache-matched-key }}
          COMPILER_HIT: ${{ steps.compiler-cache.outputs.cache-hit }}
          COMPILER_MATCHED: ${{ steps.compiler-cache.outputs.cache-matched-key }}
        run: |
          cache_status() {
            if [[ "$1" == "true" ]]; then
              printf 'exact'
            elif [[ -n "$2" ]]; then
              printf 'fallback'
            else
              printf 'miss'
            fi
          }
          package_status="$(cache_status "$PACKAGE_HIT" "$PACKAGE_MATCHED")"
          compiler_status="$(cache_status "$COMPILER_HIT" "$COMPILER_MATCHED")"
          {
            printf '### Cache restoration — %s\n\n' "$MATRIX_NAME"
            printf '| Cache | Status | Matched key |\n'
            printf '| --- | --- | --- |\n'
            printf '| Package | `%s` | `%s` |\n' "$package_status" "${PACKAGE_MATCHED:-none}"
            printf '| Compiler | `%s` | `%s` |\n' "$compiler_status" "${COMPILER_MATCHED:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish release
    needs: [release-context, build-and-test]
    if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: vision_simple-*-UTF8.zip
          path: release-assets
          merge-multiple: true
          skip-decompress: true

      - name: Generate release notes and checksums
        env:
          RELEASE_TIMESTAMP: ${{ needs.release-context.outputs.release_timestamp }}
        run: |
          git log -1 --format=%B "$GITHUB_SHA" > release-assets/commit-message.txt
          python scripts/release_artifacts.py notes \
            --assets-dir release-assets \
            --commit-message release-assets/commit-message.txt \
            --output release-notes.md \
            --checksums release-assets/SHA256SUMS.txt \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --timestamp "$RELEASE_TIMESTAMP" \
            --commit "$GITHUB_SHA" \
            --expected-count 7

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DATE: ${{ needs.release-context.outputs.release_date }}
          RELEASE_TAG: ${{ needs.release-context.outputs.release_tag }}
          RELEASE_TIME: ${{ needs.release-context.outputs.release_time }}
        run: |
          gh release create "$RELEASE_TAG" \
            release-assets/vision_simple-*-UTF8.zip \
            release-assets/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "vision-simple ${RELEASE_DATE} ${RELEASE_TIME} UTC" \
            --notes-file release-notes.md \
            --latest
