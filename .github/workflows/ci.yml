name: CI
run-name: ASan scalar portability verification / ${{ github.ref_name }} / ${{ github.run_id }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asan-fixed-scalar-b42dc07-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  asan-fixed-scalar:
    name: Linux x86_64 / GCC 14 / ASan + UBSan / natural native verification
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/verify/release-asan-b42dc07'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      matrix:
        include:
          - cache_key: linux-x86_64-gcc14-asan-ubsan
            package_key: linux-x86_64-gcc14-asan-ubsan
            policy: build.ccache:y,build.sanitizer.address:y,build.sanitizer.undefined:y
            apt_packages: g++-14 libopencv-dev iproute2 python3-dev python3-pip python3-setuptools python3-wheel
            configure: -p linux -a x86_64 --toolchain=gcc --cc=gcc-14 --cxx=g++-14 -m release --with_cuda=n --with_tensorrt=n --with_rknpu=n
            build_tests: true
    defaults:
      run:
        shell: bash
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      XMAKE_ROOT: y
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
          lfs: ${{ matrix.build_tests }}

      - name: Prepare evidence directory and selected-package query
        run: |
          mkdir -p asan-diagnostic/native-elf
          cat > asan-diagnostic/selected-package.lua <<'LUA'
          import("core.project.config")
          import("core.project.project")
          function main()
              config.load()
              project.load_targets()
              local target = assert(project.target("test_image_codec"), "missing codec target")
              local pkg = assert(target:pkg("turbobase64"), "codec lacks turbobase64 package")
              io.write(assert(pkg:installdir(), "missing selected package installdir"))
          end
          LUA

      - name: Setup xmake without cache saves
        uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a # v1
        with:
          xmake-version: ${{ matrix.xmake_version || '2.9.7' }}
          # Omit tool-cache inputs: the pinned action otherwise saves its cache in post.

      - name: Resolve xmake package path
        id: package-path
        run: |
          package_path="$(xmake l -c 'import("core.package.package"); io.write(package.installdir())')"
          printf 'path=%s\n' "$package_path" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$package_path" > asan-diagnostic/package-path.txt

      - name: Restore existing package cache (old install retained for comparison)
        id: package-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.package-path.outputs.path }}
          key: xmake-package-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.package_key }}-xmake-${{ matrix.xmake_version || '2.9.7' }}--${{ hashFiles('xmake.lua', 'xmake/**/*.lua', 'app/**/xmake.lua') }}
          restore-keys: |
            xmake-package-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.package_key }}-xmake-${{ matrix.xmake_version || '2.9.7' }}--

      - name: Restore existing compiler cache
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/.build_cache
          key: xmake-build-v2-${{ matrix.cache_key }}--${{ hashFiles('xmake.lua', 'xmake/**/*.lua', 'app/**/xmake.lua', 'app/source/**/*.c', 'app/source/**/*.cpp', 'app/source/**/*.h', 'app/source/**/*.hpp') }}
          restore-keys: |
            xmake-build-v2-${{ matrix.cache_key }}--

      - name: Record old restored TurboBase64 archives before configure
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          diag = Path(os.environ['GITHUB_WORKSPACE']) / 'asan-diagnostic'
          package_root = Path((diag / 'package-path.txt').read_text().strip())
          rows = []
          for archive in sorted((package_root / 't/turbobase64/2022.02.21').rglob('*.a')):
              relative = archive.relative_to(package_root / 't/turbobase64/2022.02.21')
              install = package_root / 't/turbobase64/2022.02.21' / relative.parts[0]
              row = {'archive': str(archive), 'install_dir': str(install), 'sha256': hashlib.sha256(archive.read_bytes()).hexdigest()}
              rows.append(row)
              print('RESTORED_OLD_TURBOBASE64=' + json.dumps(row))
          (diag / 'restored-old-packages.json').write_text(json.dumps(rows, indent=2) + '\n')
          if not rows:
              print('RESTORED_OLD_TURBOBASE64_NOT_PRESENT: record cache matched key; no claim that old archive was exercised')
          PY

      - name: Install original system dependencies and ELF audit tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ${{ matrix.apt_packages }} binutils file

      - name: Capture runner CPU, ASLR, toolchain and cache identity (read-only)
        if: always()
        run: |
          {
            git rev-parse HEAD
            git submodule status --recursive
            printf 'GITHUB_SHA=%s\nImageOS=%s\nImageVersion=%s\nRUNNER_OS=%s\nRUNNER_ARCH=%s\n' "$GITHUB_SHA" "${ImageOS-}" "${ImageVersion-}" "$RUNNER_OS" "$RUNNER_ARCH"
            printf 'ASAN_OPTIONS=%s\nUBSAN_OPTIONS=%s\n' "$ASAN_OPTIONS" "$UBSAN_OPTIONS"
            uname -a
            cat /proc/cpuinfo
            lscpu
            if ! sudo sysctl vm.mmap_rnd_bits vm.mmap_rnd_compat_bits kernel.randomize_va_space kernel.core_pattern; then
              printf 'DIAGNOSTIC_METADATA_UNAVAILABLE: read-only sysctl failed; retain error and continue native evidence capture\n' >&2
            fi
            ulimit -a
            gcc-14 --version
            g++-14 --version
            xmake --version
            dpkg-query -W -f='${Package} ${Version}\n' 'libasan*' 'libubsan*' 'libc6*' 'gcc-14*' 'libgcc*' || true
          } 2>&1 | tee asan-diagnostic/runner-state.log
          printf 'package-cache-match=%s\ncompiler-cache-match=%s\n' '${{ steps.package-cache.outputs.cache-matched-key }}' '${{ steps.compiler-cache.outputs.cache-matched-key }}' > asan-diagnostic/cache-restores.txt

      - name: Configure same sanitizer slice and capture actual package compile flags
        id: configure
        run: |
          xmake f -vD ${{ matrix.configure }} --policies=${{ matrix.policy }} -y 2>&1 | tee asan-diagnostic/configure.log
          xmake lua asan-diagnostic/selected-package.lua > asan-diagnostic/selected-package-path.txt
          printf 'SELECTED_TURBOBASE64_INSTALL=%s\n' "$(cat asan-diagnostic/selected-package-path.txt)"

      - name: Preflight actual native CPU fixtures
        id: fixtures
        run: python scripts/check_ci_fixtures.py --project-root "$GITHUB_WORKSPACE" --layer native 2>&1 | tee asan-diagnostic/fixture-preflight.log

      - name: Build real server and original seventeen native targets (one build each)
        id: build
        continue-on-error: true
        run: |
          failed=0
          for target in server test_vision_helper test_cvt test_common test_trace_id test_yolo_postprocess test_ocr_decode test_infer_inputs test_config_load test_tracker test_pipeline test_yolo_tasks test_ocr_batch test_ocr_morphology test_ocr_morphology_dataset test_subtitle_timeline test_image_codec test_image_budget_service; do
            if ! xmake build -vD "$target" 2>&1 | tee "asan-diagnostic/build-$target.log"; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Capture server/native ELF and xmake configuration
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, os, shutil, subprocess
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          diag = root / 'asan-diagnostic'
          binary_dir = root / 'build/linux/x86_64/release'
          with (diag / 'elf-inspection.log').open('w') as log:
              for target in ['server'] + ["test_vision_helper","test_cvt","test_common","test_trace_id","test_yolo_postprocess","test_ocr_decode","test_infer_inputs","test_config_load","test_tracker","test_pipeline","test_yolo_tasks","test_ocr_batch","test_ocr_morphology","test_ocr_morphology_dataset","test_subtitle_timeline","test_image_codec","test_image_budget_service"]:
                  binary = binary_dir / ('vision_simple-server' if target == 'server' else target)
                  if not binary.exists():
                      log.write('MISSING_ELF=' + str(binary) + '\n')
                      continue
                  shutil.copy2(binary, diag / 'native-elf' / binary.name)
                  log.write('ELF_SHA256=' + hashlib.sha256(binary.read_bytes()).hexdigest() + ' ' + str(binary) + '\n')
                  log.flush()
                  for command in [['file', str(binary)], ['readelf', '-h', '-l', '-d', '-n', str(binary)], ['ldd', str(binary)]]:
                      subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, check=False)
          for conf in (root / '.xmake').rglob('xmake.conf'):
              destination = diag / 'xmake-configuration' / conf.relative_to(root)
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(conf, destination)
          PY

      - name: Audit selected fixed package scalar ISA and sanitizer imports
        id: audit
        if: success() && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          python3 - <<'PY' 2>&1 | tee asan-diagnostic/package-audit.log
          import hashlib, json, os, re, shutil, subprocess
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          diag = root / 'asan-diagnostic'
          selected = Path((diag / 'selected-package-path.txt').read_text().strip())
          print('SELECTED_TURBOBASE64_INSTALL=' + str(selected), flush=True)
          assert '2022.02.21-vs.1' in selected.parts, 'codec must select fixed recipe version, never old cached 2022.02.21'
          archives = sorted(selected.rglob('*.a'))
          assert len(archives) == 1, 'expected one selected static TurboBase64 archive: ' + repr(archives)
          archive = archives[0]
          sha = hashlib.sha256(archive.read_bytes()).hexdigest()
          print('SELECTED_TURBOBASE64_ARCHIVE_SHA256=' + sha + ' ' + str(archive), flush=True)
          assert sha != 'feab3dc438424222123820cccdaa5144fe5e1e35e4e5f891ad623285627d4552', 'confirmed failing cached archive reused'
          old = json.loads((diag / 'restored-old-packages.json').read_text())
          for item in old:
              print('RESTORED_OLD_ARCHIVE=' + json.dumps(item), flush=True)
              assert str(selected) != item['install_dir'], 'old cached installation reused'
          shutil.copy2(archive, diag / 'fixed-turbobase64.a')
          for filename in ['manifest.txt', 'logs/install.txt']:
              candidate = selected / filename
              if candidate.exists():
                  shutil.copy2(candidate, diag / ('selected-' + filename.replace('/', '-')))
          def run(command, output):
              p = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, check=True)
              (diag / output).write_text(p.stdout)
              return p.stdout
          members = run(['ar', 't', str(archive)], 'fixed-archive-members.txt').splitlines()
          scalar_members = [member for member in members if re.search(r'turbob64[cd]\.c\.(?:o|obj)$', member)]
          assert len(scalar_members) == 2, 'expected exactly two scalar archive objects: ' + repr(scalar_members)
          audit = []
          for member in scalar_members:
              obj = diag / member
              obj.write_bytes(subprocess.run(['ar', 'p', str(archive), member], stdout=subprocess.PIPE, check=True).stdout)
              disassembly = run(['objdump', '-d', '-w', str(obj)], member + '-disassembly.txt')
              symbols = run(['nm', '-u', str(obj)], member + '-imports.txt')
              assert '__asan_' in symbols, 'ASan instrumentation absent in scalar object: ' + member
              instructions = []
              forbidden = []
              for line in disassembly.splitlines():
                  match = re.match(r'^\s*[0-9a-f]+:\s+((?:[0-9a-f]{2}\s+)+)\s*(.*)$', line, re.I)
                  if match:
                      raw = match.group(1).split()
                      text = match.group(2)
                      instructions.append(line)
                      # Scalar -march=x86-64 permits neither AVX/AVX2 VEX nor AVX512 EVEX encodings.
                      opcode = next((byte.lower() for byte in raw if byte.lower() not in ['26', '2e', '36', '3e', '64', '65', '66', '67', 'f0', 'f2', 'f3'] and not 0x40 <= int(byte, 16) <= 0x4f), '')
                      if opcode in ['c4', 'c5', '62'] or re.search(r'\b[yz]mm[0-9]+\b|%k[0-7]\b', text):
                          forbidden.append(line)
              row = {'member': member, 'object_sha256': hashlib.sha256(obj.read_bytes()).hexdigest(), 'instructions_decoded': len(instructions), 'asan_imports': True, 'forbidden_baseline_isa': forbidden}
              audit.append(row)
              print('SCALAR_ISA_AUDIT=' + json.dumps(row), flush=True)
              assert instructions and not forbidden, 'forbidden AVX/AVX2/AVX512 in scalar object: ' + member
          flags = (diag / 'configure.log').read_text(errors='replace')
          scalar_commands = [line for line in flags.splitlines() if re.search(r'turbob64[cd]\.c(?:\s|$)', line) and '-march=x86-64' in line]
          print('FIXED_SCALAR_COMPILE_COMMANDS=' + json.dumps(scalar_commands), flush=True)
          assert any('turbob64c.c' in line for line in scalar_commands) and any('turbob64d.c' in line for line in scalar_commands), 'actual fixed scalar compile commands missing from configure -vD log'
          codec = root / 'build/linux/x86_64/release/test_image_codec'
          dynamic = run(['readelf', '-d', str(codec)], 'codec-dynamic.txt')
          assert 'libasan.so' in dynamic and 'libubsan.so' in dynamic, 'codec sanitizer runtime dependencies absent'
          cpuinfo = Path('/proc/cpuinfo').read_text()
          flags_lines = [line.split(':', 1)[1].split() for line in cpuinfo.splitlines() if line.startswith('flags')]
          avx2_only = bool(flags_lines) and all('avx2' in values and not any(flag.startswith('avx512') for flag in values) for values in flags_lines)
          model = next((line.split(':', 1)[1].strip() for line in cpuinfo.splitlines() if line.startswith('model name')), 'unknown')
          coverage = 'AVX2-only runtime host: natural native results exercise this CPU without AVX512.' if avx2_only else 'LIMITATION: runner is not proven AVX2-only; scalar static audit is available, AVX2-only runtime coverage requires separate full CI evidence.'
          print('CPU_MODEL=' + model, flush=True)
          print('CPU_COVERAGE=' + coverage, flush=True)
          (diag / 'package-audit.json').write_text(json.dumps({'selected_install': str(selected), 'selected_archive_sha256': sha, 'restored_old': old, 'scalar_objects': audit, 'scalar_compile_commands': scalar_commands, 'cpu_model': model, 'avx2_only_host': avx2_only, 'cpu_coverage': coverage}, indent=2) + '\n')
          PY

      - name: Run original seventeen native targets once naturally through xmake
        id: native
        if: success() && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          failed=0
          : > asan-diagnostic/native-status.tsv
          for target in test_vision_helper test_cvt test_common test_trace_id test_yolo_postprocess test_ocr_decode test_config_load test_tracker test_subtitle_timeline test_image_codec test_infer_inputs test_pipeline test_yolo_tasks test_ocr_batch test_ocr_morphology test_ocr_morphology_dataset test_image_budget_service; do
            args=()
            case "$target" in
              test_infer_inputs|test_pipeline|test_yolo_tasks|test_ocr_batch|test_ocr_morphology|test_ocr_morphology_dataset|test_image_budget_service)
                args=(--project-root "$GITHUB_WORKSPACE") ;;
            esac
            printf 'NATIVE_COMMAND:'
            printf ' %q' xmake run "$target" "${args[@]}"
            printf '\n'
            if xmake run "$target" "${args[@]}" > "asan-diagnostic/$target.stdout" 2> "asan-diagnostic/$target.stderr"; then
              status=0
            else
              status=$?
              failed=1
            fi
            printf '%s\t%s\n' "$target" "$status" >> asan-diagnostic/native-status.tsv
            printf 'NATIVE_STATUS: %s %s\n' "$target" "$status"
            cat "asan-diagnostic/$target.stdout"
            cat "asan-diagnostic/$target.stderr" >&2
           done
          exit "$failed"

      - name: Upload native results, fixed archive/scalar objects, ELF and configuration
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: asan-fixed-scalar-${{ github.run_id }}-${{ github.run_attempt }}
          path: asan-diagnostic/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Require real native success, fixed package audit and complete builds
        if: always()
        env:
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          FIXTURES_OUTCOME: ${{ steps.fixtures.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
        run: |
          test "$CONFIGURE_OUTCOME" = success
          test "$FIXTURES_OUTCOME" = success
          test "$BUILD_OUTCOME" = success
          test "$AUDIT_OUTCOME" = success
          test "$NATIVE_OUTCOME" = success
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = ["test_vision_helper","test_cvt","test_common","test_trace_id","test_yolo_postprocess","test_ocr_decode","test_config_load","test_tracker","test_subtitle_timeline","test_image_codec","test_infer_inputs","test_pipeline","test_yolo_tasks","test_ocr_batch","test_ocr_morphology","test_ocr_morphology_dataset","test_image_budget_service"]
          rows = [line.split('\t') for line in Path('asan-diagnostic/native-status.tsv').read_text().splitlines()]
          assert [row[0] for row in rows] == expected and all(row[1] == '0' for row in rows), rows
          audit = json.loads(Path('asan-diagnostic/package-audit.json').read_text())
          print('17/17 original native targets exited naturally with status0; fixed package scalar audit passed.')
          print(audit['cpu_coverage'])
          PY
