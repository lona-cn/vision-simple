name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '2.9.7'

      - name: Cache xmake packages
        uses: actions/cache@v4
        with:
          path: ~/.xmake/packages
          key: xmake-pkgs-${{ runner.os }}-${{ hashFiles('xmake.lua', 'xmake/project.lua') }}
          restore-keys: xmake-pkgs-${{ runner.os }}-

      - name: Cache build objects
        uses: actions/cache@v4
        with:
          path: build/
          key: xmake-obj-${{ runner.os }}-${{ hashFiles('xmake.lua', 'xmake/project.lua') }}-${{ github.sha }}
          restore-keys: |
            xmake-obj-${{ runner.os }}-${{ hashFiles('xmake.lua', 'xmake/project.lua') }}-
            xmake-obj-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopencv-dev

      - name: Configure
        run: xmake f -p linux -a x86_64 --toolchain=gcc -m release -y

      - name: Build server
        run: xmake build server

      - name: Build unit tests
        run: |
          xmake build test_vision_helper
          xmake build test_cvt
          xmake build test_common

      - name: Run unit tests
        run: |
          xmake run test_vision_helper
          xmake run test_cvt
          xmake run test_common
