name: CI
run-name: ASan evidence / ${{ github.ref_name }} / ${{ github.run_id }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asan-evidence-b42dc07-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  asan-diagnostic:
    name: Linux x86_64 / GCC 14 / ASan + UBSan evidence
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/verify/release-asan-b42dc07'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      matrix:
        include:
          - cache_key: linux-x86_64-gcc14-asan-ubsan
            package_key: linux-x86_64-gcc14-asan-ubsan
            policy: build.ccache:y,build.sanitizer.address:y,build.sanitizer.undefined:y
            apt_packages: g++-14 libopencv-dev iproute2 python3-dev python3-pip python3-setuptools python3-wheel
            configure: -p linux -a x86_64 --toolchain=gcc --cc=gcc-14 --cxx=g++-14 -m release --with_cuda=n --with_tensorrt=n --with_rknpu=n
            build_tests: true
    defaults:
      run:
        shell: bash
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      XMAKE_ROOT: y
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
          lfs: ${{ matrix.build_tests }}

      - name: Prepare diagnostic controllers
        run: |
          mkdir -p asan-diagnostic/native-elf
          cat > asan-diagnostic/gdb-controller.py <<'PY'
          import gdb, os, json, shlex, signal, traceback
          from pathlib import Path
          out = Path(os.environ['DIAG_TARGET_DIR'])
          state = {'target': os.environ['DIAG_TARGET'], 'main_reached': False, 'exit_code': None, 'fatal_signal': None, 'controller_error': None}
          def capture(label):
              print('DIAGNOSTIC_STOP=' + label, flush=True)
              for command in ['thread apply all bt full', 'info registers', 'x/i $pc', 'x/16bx $pc', 'x/16i $pc', 'x/16i $pc-16', 'info proc mappings', 'info sharedlibrary']:
                  try:
                      print(gdb.execute(command, to_string=True), flush=True)
                  except gdb.error as error:
                      print(command + ': ' + str(error), flush=True)
              try:
                  pid = gdb.selected_inferior().pid
                  if pid:
                      (out / (label + '-proc-maps.txt')).write_text(Path('/proc/%d/maps' % pid).read_text())
              except Exception as error:
                  print('proc maps capture: ' + str(error), flush=True)
          class MainMarker(gdb.Breakpoint):
              def stop(self):
                  state['main_reached'] = True
                  print('DIAG_ENTER_MAIN', flush=True)
                  capture('MAIN_REACHED')
                  state['marker_stop'] = True
                  return True
          class LibcStartMarker(gdb.Breakpoint):
              def stop(self):
                  try:
                      # Ubuntu x86_64 SysV: __libc_start_main receives main in RDI.
                      address = int(gdb.parse_and_eval('$rdi'))
                      print('MAIN_RESOLVED_VIA_LIBC_START_MAIN_RDI=0x%x' % address, flush=True)
                      MainMarker('*0x%x' % address)
                  except Exception as error:
                      print('MAIN_ADDRESS_UNAVAILABLE: ' + str(error), flush=True)
                  self.enabled = False
                  return False
          def exited(event):
              state['exit_code'] = getattr(event, 'exit_code', None)
          gdb.events.exited.connect(exited)
          def stopped(event):
              if isinstance(event, gdb.SignalEvent):
                  print('FIRST_CHANCE_SIGNAL=' + event.stop_signal, flush=True)
                  if event.stop_signal in ['SIGSEGV', 'SIGILL', 'SIGABRT', 'SIGBUS']:
                      state['fatal_signal'] = event.stop_signal
                      capture(event.stop_signal)
          gdb.events.stop.connect(stopped)
          status = 125
          try:
              gdb.execute('set pagination off')
              gdb.execute('set confirm off')
              gdb.execute('set disable-randomization off')
              gdb.execute('show disable-randomization')
              gdb.execute('handle SIGSEGV SIGILL SIGABRT SIGBUS stop print pass')
              try:
                  symbol = gdb.parse_and_eval('&main')
                  if symbol is not None:
                      MainMarker('main')
                      print('MAIN_BREAKPOINT_AVAILABLE', flush=True)
                  else:
                      print('MAIN_BREAKPOINT_UNAVAILABLE: original release symbols stripped; compile flags unchanged', flush=True)
              except gdb.error as error:
                  print('MAIN_SYMBOL_UNAVAILABLE: ' + str(error), flush=True)
                  gdb.execute('set breakpoint pending on')
                  LibcStartMarker('__libc_start_main')
                  print('MAIN_FALLBACK_PENDING: Linux x86_64 SysV __libc_start_main RDI; no compile flags changed', flush=True)
              arguments = json.loads(os.environ['DIAG_ARGUMENTS'])
              gdb.execute('set args ' + shlex.join(arguments) + ' > ' + shlex.quote(str(out / 'app.stdout')) + ' 2> ' + shlex.quote(str(out / 'app.stderr')))
              gdb.execute('run')
              while state.pop('marker_stop', False) and state['exit_code'] is None and not state['fatal_signal']:
                  gdb.execute('continue')
              if state['fatal_signal']:
                  status = 128 + int(getattr(signal, state['fatal_signal']))
                  gdb.execute('kill')
              elif state['exit_code'] is not None:
                  status = int(state['exit_code'])
              else:
                  state['controller_error'] = 'inferior stopped without a recorded normal exit or requested fatal signal'
                  capture('UNEXPECTED_STOP')
                  gdb.execute('kill')
          except Exception:
              state['controller_error'] = traceback.format_exc()
              print(state['controller_error'], flush=True)
              try:
                  gdb.execute('kill')
              except gdb.error:
                  pass
          state['propagated_status'] = status
          (out / 'result.json').write_text(json.dumps(state, indent=2) + '\n')
          print('INFERIOR_RESULT=' + json.dumps(state), flush=True)
          gdb.execute('quit %d' % status)
          PY
          cat > asan-diagnostic/run-native.py <<'PY'
          import json, os, subprocess, signal
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          diag = root / 'asan-diagnostic'
          targets = ["test_vision_helper","test_cvt","test_common","test_trace_id","test_yolo_postprocess","test_ocr_decode","test_infer_inputs","test_config_load","test_tracker","test_pipeline","test_yolo_tasks","test_ocr_batch","test_ocr_morphology","test_ocr_morphology_dataset","test_subtitle_timeline","test_image_codec","test_image_budget_service"]
          fixtures = set(["test_infer_inputs","test_pipeline","test_yolo_tasks","test_ocr_batch","test_ocr_morphology","test_ocr_morphology_dataset","test_image_budget_service"])
          rows = []
          for target in targets:
              out = diag / target
              out.mkdir(exist_ok=True)
              env = os.environ.copy()
              env.update(DIAG_TARGET=target, DIAG_TARGET_DIR=str(out), DIAG_ARGUMENTS=json.dumps(['--project-root', str(root)] if target in fixtures else []))
              with (out / 'gdb.log').open('w') as log:
                  try:
                      process = subprocess.Popen(['xmake', 'lua', str(diag / 'run-gdb.lua'), target, str(diag / 'gdb-controller.py')], cwd=root, env=env, stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
                      wrapper_status = process.wait(timeout=600)
                  except subprocess.TimeoutExpired:
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait()
                      wrapper_status = 124
                      log.write('CONTROLLER_TIMEOUT: one attempt consumed; no retry\n')
              result_path = out / 'result.json'
              result = json.loads(result_path.read_text()) if result_path.exists() else {'controller_error': 'no inferior result recorded', 'propagated_status': 125}
              result['wrapper_status'] = wrapper_status
              result['target'] = target
              result['passed'] = wrapper_status == 0 and result.get('exit_code') == 0 and result.get('propagated_status') == 0 and not result.get('fatal_signal') and not result.get('controller_error')
              rows.append(result)
              print(json.dumps(result), flush=True)
              for stream in ['app.stdout', 'app.stderr']:
                  path = out / stream
                  print('=== ' + target + ' ' + stream + ' ===', flush=True)
                  if path.exists():
                      print(path.read_text(errors='replace'), flush=True)
          codec = next(row for row in rows if row['target'] == 'test_image_codec')
          interpretation = 'INCONCLUSIVE: codec passed on this runner under debugger; this does not fix or disprove the original failure.' if codec['passed'] else 'Codec failed: inspect first-chance signal, stack, instructions, mappings and application streams; no fix applied.'
          print(interpretation, flush=True)
          (diag / 'summary.json').write_text(json.dumps({'interpretation': interpretation, 'targets': rows}, indent=2) + '\n')
          raise SystemExit(0 if all(row['passed'] for row in rows) else 1)
          PY
          cat > asan-diagnostic/run-gdb.lua <<'LUA'
          import("core.project.config")
          import("core.project.project")
          import("private.action.run.runenvs")
          function main(name, commands)
              config.load()
              project.load_targets()
              local target = assert(project.target(name), "missing target: " .. name)
              local targetfile = path.absolute(target:targetfile())
              local function add_packages(t, seen)
                  if seen[t:name()] then return end
                  seen[t:name()] = true
                  os.addenvs(t:pkgenvs())
                  for _, dep in ipairs(t:orderdeps()) do add_packages(dep, seen) end
              end
              add_packages(target, {})
              local addenvs, setenvs = runenvs.make(target)
              print("DIAGNOSTIC_TARGETFILE=" .. targetfile)
              print("DIAGNOSTIC_RUNDIR=" .. path.absolute(target:rundir()))
              for key, value in pairs(addenvs or {}) do print("DIAGNOSTIC_ADDENV " .. key .. "=" .. table.concat(table.wrap(value), ":")) end
              for key, value in pairs(setenvs or {}) do print("DIAGNOSTIC_SETENV " .. key .. "=" .. table.concat(table.wrap(value), ":")) end
              os.execv("gdb", {"--batch", "-nx", "-q", "-x", commands, "--args", targetfile}, {curdir = target:rundir(), addenvs = addenvs, setenvs = setenvs})
          end
          LUA

      - name: Setup xmake without cache saves
        uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a # v1
        with:
          xmake-version: ${{ matrix.xmake_version || '2.9.7' }}
          # Omit actions-cache-folder/key: this action otherwise saves its tool cache in post.

      - name: Resolve xmake package path
        id: package-path
        run: |
          package_path="$(xmake l -c 'import("core.package.package"); io.write(package.installdir())')"
          printf 'path=%s\n' "$package_path" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$package_path" > asan-diagnostic/package-path.txt

      - name: Restore package cache
        id: package-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.package-path.outputs.path }}
          key: xmake-package-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.package_key }}-xmake-${{ matrix.xmake_version || '2.9.7' }}--${{ hashFiles('xmake.lua', 'xmake/**/*.lua', 'app/**/xmake.lua') }}
          restore-keys: |
            xmake-package-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.package_key }}-xmake-${{ matrix.xmake_version || '2.9.7' }}--

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/.build_cache
          key: xmake-build-v2-${{ matrix.cache_key }}--${{ hashFiles('xmake.lua', 'xmake/**/*.lua', 'app/**/xmake.lua', 'app/source/**/*.c', 'app/source/**/*.cpp', 'app/source/**/*.h', 'app/source/**/*.hpp') }}
          restore-keys: |
            xmake-build-v2-${{ matrix.cache_key }}--

      - name: Install Linux system dependencies and debugger
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ${{ matrix.apt_packages }} gdb binutils file

      - name: Capture original runner and toolchain state (read-only)
        if: always()
        run: |
          {
            git rev-parse HEAD
            git submodule status --recursive
            printf 'GITHUB_SHA=%s\nImageOS=%s\nImageVersion=%s\nRUNNER_OS=%s\nRUNNER_ARCH=%s\n' "$GITHUB_SHA" "${ImageOS-}" "${ImageVersion-}" "$RUNNER_OS" "$RUNNER_ARCH"
            printf 'ASAN_OPTIONS=%s\nUBSAN_OPTIONS=%s\n' "$ASAN_OPTIONS" "$UBSAN_OPTIONS"
            uname -a
            cat /proc/cpuinfo
            lscpu
            sysctl vm.mmap_rnd_bits vm.mmap_rnd_compat_bits kernel.randomize_va_space kernel.core_pattern
            ulimit -a
            gcc-14 --version
            g++-14 --version
            xmake --version
            gdb --version
            dpkg-query -W -f='${Package} ${Version}\n' 'libasan*' 'libubsan*' 'libc6*' 'gcc-14*' 'libgcc*' || true
          } 2>&1 | tee asan-diagnostic/runner-state.log
          printf 'package-cache-match=%s\ncompiler-cache-match=%s\n' '${{ steps.package-cache.outputs.cache-matched-key }}' '${{ steps.compiler-cache.outputs.cache-matched-key }}' > asan-diagnostic/cache-restores.txt

      - name: Configure unchanged sanitizer slice
        id: configure
        run: xmake f ${{ matrix.configure }} --policies=${{ matrix.policy }} -y 2>&1 | tee asan-diagnostic/configure.log

      - name: Preflight actual native CPU fixtures
        id: fixtures
        run: python scripts/check_ci_fixtures.py --project-root "$GITHUB_WORKSPACE" --layer native 2>&1 | tee asan-diagnostic/fixture-preflight.log

      - name: Build real server and same seventeen native targets (one build each)
        id: build
        continue-on-error: true
        run: |
          failed=0
          for target in server test_vision_helper test_cvt test_common test_trace_id test_yolo_postprocess test_ocr_decode test_infer_inputs test_config_load test_tracker test_pipeline test_yolo_tasks test_ocr_batch test_ocr_morphology test_ocr_morphology_dataset test_subtitle_timeline test_image_codec test_image_budget_service; do
            if ! xmake build -vD "$target" 2>&1 | tee "asan-diagnostic/build-$target.log"; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Capture native ELF and unchanged xmake configuration
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, os, shutil, subprocess
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          diag = root / 'asan-diagnostic'
          binary_dir = root / 'build/linux/x86_64/release'
          targets = ['server'] + ["test_vision_helper","test_cvt","test_common","test_trace_id","test_yolo_postprocess","test_ocr_decode","test_infer_inputs","test_config_load","test_tracker","test_pipeline","test_yolo_tasks","test_ocr_batch","test_ocr_morphology","test_ocr_morphology_dataset","test_subtitle_timeline","test_image_codec","test_image_budget_service"]
          with (diag / 'elf-inspection.log').open('w') as log:
              for target in targets:
                  binary = binary_dir / ('vision_simple-server' if target == 'server' else target)
                  if not binary.exists():
                      log.write('MISSING_ELF=' + str(binary) + '\n')
                      continue
                  shutil.copy2(binary, diag / 'native-elf' / target)
                  log.write('ELF_SHA256=' + hashlib.sha256(binary.read_bytes()).hexdigest() + ' ' + str(binary) + '\n')
                  log.flush()
                  for command in [['file', str(binary)], ['readelf', '-h', '-l', '-d', '-n', str(binary)], ['ldd', str(binary)]]:
                      subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, check=False)
                  if target == 'test_image_codec':
                      subprocess.run(['nm', '-a', str(binary)], stdout=log, stderr=subprocess.STDOUT, check=False)
              package_root_file = diag / 'package-path.txt'
              if package_root_file.exists():
                  package_root = Path(package_root_file.read_text().strip())
                  for binary in package_root.glob('t/turbobase64/**/*.a'):
                      log.write('TURBOBASE64_ARCHIVE_SHA256=' + hashlib.sha256(binary.read_bytes()).hexdigest() + ' ' + str(binary) + '\n')
                      log.flush()
                      with (diag / ('turbobase64-' + hashlib.sha256(str(binary).encode()).hexdigest()[:12] + '-disassembly.log')).open('w') as disassembly:
                          subprocess.run(['objdump', '-d', str(binary)], stdout=disassembly, stderr=subprocess.STDOUT, check=False)
                      shutil.copy2(binary, diag / ('turbobase64-' + hashlib.sha256(str(binary).encode()).hexdigest()[:12] + '.a'))
          for conf in (root / '.xmake').rglob('xmake.conf'):
              destination = diag / 'xmake-configuration' / conf.relative_to(root)
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(conf, destination)
          PY

      - name: Run all seventeen native targets once under GDB with original ASLR
        id: native
        if: success() && steps.build.outcome == 'success'
        continue-on-error: true
        run: python3 asan-diagnostic/run-native.py 2>&1 | tee asan-diagnostic/native-controller.log

      - name: Upload diagnostic logs, commands, native ELF and configuration
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: asan-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: asan-diagnostic/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Enforce diagnostic failures (never green when an inferior failed)
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
        run: |
          test "$BUILD_OUTCOME" = success
          test "$NATIVE_OUTCOME" = success
          python3 - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('asan-diagnostic/summary.json').read_text())
          assert len(summary['targets']) == 17 and all(row['passed'] for row in summary['targets']), summary
          print(summary['interpretation'])
          PY
