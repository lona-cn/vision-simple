name: Docker

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the selected version tag to GHCR
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: docker-cpu-publication
  cancel-in-progress: false

jobs:
  release:
    name: Resolve release policy
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
    env:
      GHCR_IMAGE: ghcr.io/lona-cn/vision-simple
      MANUAL_PUBLISH: ${{ inputs.publish == true && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test release policy boundaries
        run: python3 -m unittest discover -s scripts -p test_docker_release.py

      - name: Resolve release policy
        id: plan
        run: python3 scripts/docker_release.py plan

  build:
    name: Build and test ${{ matrix.platform }}
    needs: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            architecture: amd64
            runner: ubuntu-24.04
            dockerfile: docker/Dockerfile.debian-bookworm-x86_64-cpu
          - platform: linux/arm64
            architecture: arm64
            runner: ubuntu-24.04-arm
            dockerfile: docker/Dockerfile.debian-bookworm-arm64-cpu
    permissions:
      contents: read
      packages: write
    env:
      GHCR_IMAGE: ghcr.io/lona-cn/vision-simple
      MANUAL_PUBLISH: ${{ inputs.publish == true && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.platform }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          provenance: false
          sbom: false
          tags: vision-simple:ci
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=vision-simple-${{ matrix.architecture }}-cpu
          cache-to: type=gha,mode=max,scope=vision-simple-${{ matrix.architecture }}-cpu

      - name: Pin tested image identity
        id: tested-image
        shell: bash
        run: |
          image_id="$(docker image inspect --format '{{.Id}}' vision-simple:ci)"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'id=%s\n' "$image_id" >> "$GITHUB_OUTPUT"

      - name: Smoke-test HTTP container and clean shutdown
        timeout-minutes: 5
        env:
          TEST_IMAGE_ID: ${{ steps.tested-image.outputs.id }}
        run: python3 scripts/test_docker_smoke.py --image "$TEST_IMAGE_ID" --platform "${{ matrix.platform }}"

      - name: Log in to GHCR
        if: needs.release.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested ${{ matrix.architecture }} image
        if: needs.release.outputs.publish == 'true'
        env:
          TEST_IMAGE_ID: ${{ steps.tested-image.outputs.id }}
          IMAGE_ARCHITECTURE: ${{ matrix.architecture }}
        run: python3 scripts/docker_release.py publish-platform --local-image "$TEST_IMAGE_ID" --architecture "$IMAGE_ARCHITECTURE"

  publish-manifest:
    name: Publish multi-platform manifest
    needs: [release, build]
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      GHCR_IMAGE: ghcr.io/lona-cn/vision-simple
      MANUAL_PUBLISH: ${{ inputs.publish == true && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and verify multi-platform tags
        run: python3 scripts/docker_release.py publish-manifest
  build-only-summary:
    name: Summarize multi-platform build verification
    needs: [release, build]
    if: needs.release.outputs.publish == 'false'
    runs-on: ubuntu-24.04
    steps:
      - name: Summarize build-only verification
        run: |
          echo "## Multi-platform Docker build verified (not published)" >> "$GITHUB_STEP_SUMMARY"
          echo "The linux/amd64 and linux/arm64 CPU images passed their HTTP container smoke tests and clean shutdown. No registry login or push was performed." >> "$GITHUB_STEP_SUMMARY"
