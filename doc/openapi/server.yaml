openapi: 3.0.1
info:
  title: vision-simple
  description: >-
    原生默认监听127.0.0.1:11451；Docker在target配置复制后显式覆盖container host为0.0.0.0，默认管理仍关闭。
    只有GET /v0/infer/stats与POST /v0/infer/unload使用ManagementBearerAuth；推理/catalog/health/tracking/subtitle/OpenAI/MCP权限不变，无内建用户认证或租户隔离。
    字符串http_management_token_env省略/空值关闭管理(403 management_disabled)，无默认变量名或自动凭证。
    显式名称须匹配[A-Za-z_][A-Za-z0-9_]*且最多128字节；外部提供的值须为1-4096可见ASCII字节，无空白/control，推荐32+随机字节编码的高熵秘密。
    名称无效、配置变量缺失/空值/不安全使启动失败，无fallback；秘密仅加载一次，轮换须重启，不放入YAML/image/log/query/cookie。
    回滚当前配置删除/清空option禁用管理；仅unset配置变量使启动失败。旧binary忽略新option并恢复无鉴权，回滚前须保留exact admin-path proxy deny/私有backend并验证外部拒绝。
    CORS不是认证；公开部署需TLS鉴权代理和私有后端，推理入口默认拒绝两个管理exactpath（query不影响匹配）。
    管理专用转发需外部管理员授权，保留Authorization bearer并重写Host/Origin到可信后端authority；先授权原始Origin，回环/代理无免认证。
    HTTP共享同listener与四IOloops，阻塞业务使用独立有界data/control调度。
    字符串options：http_data_workers=4、http_data_queue_capacity=4、
    http_control_workers=1、http_control_queue_capacity=4，workers1-32，queues1-128。
    每lane包括等待IOcallback的completed handler驻留不超过workers+queue。
    完整正文Submit后、业务解析前接纳；满/停止返回该端点503 service_overloaded与Retry-After:1。
    Transport handler额度不等于共享服务ImageCredit：排队不占image credit或decoded bytes；
    接纳后保持模型/配置优先级，服务图像额度仅由实际Run持有。
    HTTP timeout从完整正文Submit开始，包含排队、模型加载、解码；断连合作式取消且须物理drain。
    Health绕过调度队列、cache/inference锁及模型加载；不保证模型有效或warmup；
    暂时queuefull不改变ready，control lane也可能overload。Docker HEALTHCHECK使用/livez。
    字幕video上传使用data lane（含streaming写盘/网络等待），metadata管理使用control lane。
    Streaming video上传可在正文完整前持有transport handler，但不取得推理ImageCredit；完整正文接纳描述JSON推理。
    支持顺序HTTP keepalive；活动异步handler期间同连接第二pipeline请求安全关闭，并发请用独立连接。
    共享 v0/v1/OpenAI/MCP 推理服务的解码预算：infer_max_image_pixels 默认16777216，
    infer_max_batch_decoded_bytes 默认67108864，infer_max_inflight_decoded_bytes 默认268435456，
    均为正整数字符串 options，不覆盖独立 tracking 服务。模型/配置错误优先；随后检查取消、
    超时、关闭，再按 infer_pipeline_max_batches（默认4，非驻留 capacity）取得请求 credit；
    credit 满立即503且不解码 base64。严格 base64 只解码一次，按索引只读 header 预检，
    首个无效图400 invalid_image，单图/首次累计批次超限400 image_limit_exceeded；
    全批次预留全局字节，满则503 service_overloaded，以上均不调用 imdecode。
    Header预检覆盖本构建 PNG/JPEG/BMP/P1-P7/PF-Pf/Radiance HDR/SunRAS，WebP需启用codec；
    TIFF/JP2/EXR/AVIF未启用。正宽高不超过INT_MAX，乘加检查溢出；
    默认彩色解码遵循EXIF并复核像素数和CV_8UC3，方向交换不改像素额度。
    Header通过不保证payload可推理：codec失败或非CV_8UC3仍为invalid_image；
    OpenCV4.10灰度Pf即使用彩色标志仍输出CV_8UC1，因此拒绝且不额外归一化。
    额度估算是BGR3像素字节，不是RSS，不含压缩正文、codec临时内存和模型/工作区。
    credit覆盖预检至物理Run结束；任务drain、输入析构后返还额度，不挂响应或模型租约。
    普通HTTP及MCP断连请求合作式取消，但不能打断ORT或提前返还；timeout/shutdown同样等待原生drain。
    共享service及原生v0/v1有效模型空批次保留空结果/控制检查，不占image credit/字节/decode_calls，图像预算满也如此；
    仍须通过transport接纳。MCP工具images minItems=1，空数组invalid_request；OpenAI chat要求实际图像，不提供原生空批次语义。
  version: 0.4.6
tags: []
paths:
  /livez:
    get:
      summary: Listener liveness (no model or queue dependency)
      responses:
        '200':
          description: Process HTTP loop is alive; not a model validity or warmup guarantee.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [alive]}
              example: {status: alive}
  /readyz:
    get:
      summary: Accepting work and not stopping (queue saturation is not draining)
      responses:
        '200':
          description: Operational and accepting, regardless of temporary dispatch overload.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ready]}
              example: {status: ready}
        '503':
          description: Draining; new work is no longer accepted.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [not_ready]}
              example: {status: not_ready}
