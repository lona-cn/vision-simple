  /v0/infer/models:
    get:
      summary: 列出模型
      deprecated: false
      description: ''
      tags: []
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
              examples:
                '1':
                  summary: 成功示例
                  value:
                    yolo:
                      - hd2-yolo11n-fp16
                      - hd2-yolo11n-fp32
                    ocr:
                      - ppocr-v4
          headers: {}
        '500':
          description: model_config_failed 或序列化失败的 internal_error。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferError'
      security: []
  /v0/infer/ocr:
