        '400': {$ref: '#/components/responses/TrackingInvalid'}
        '403': {$ref: '#/components/responses/TrackingOrigin'}
        '404': {$ref: '#/components/responses/TrackingMissing'}
        '409': {$ref: '#/components/responses/TrackingFrameConflict'}
        '413': {$ref: '#/components/responses/TrackingBodyLimit'}
        '417': {$ref: '#/components/responses/TrackingExpectation'}
        '500': {$ref: '#/components/responses/TrackingFailed'}
        '503': {$ref: '#/components/responses/TrackingUnavailable'}
