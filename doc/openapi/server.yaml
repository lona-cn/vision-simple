  /v0/infer/unload:
    post:
      summary: 卸载空闲模型
      description: >-
        不删除活动请求正在使用的实例（包括等待 Run、解码和序列化）。
        未加载返回 404；活动实例返回 409；下次推理会重新加载。
        逻辑卸载不保证 ORT/provider 立即归还 RSS 或显存。
        管理默认关闭；显式配置http_management_token_env及外部秘密才能启用。
        headers完成先验证bearer，再检查可信Host/Origin，早于body/100 Continue/queue/JSON/model/cache。
        正确token即使loopback/proxy也必须；Host端口须匹配后端，允许loopback或显式非wildcard bind，wildcard不是authority通配。
        Origin缺省允许CLI；提供时须为可信HTTP(S) authority，无path/query/fragment/userinfo；empty/null/malformed拒绝。
        忽略Forwarded/X-*，不支持query/cookie凭证。OPTIONS403且不使用宽松CORS；其他推理CORS不变。
        精确application/json，正文最多64KiB，Expect仅100-continue且授权后才发送；拒绝未完成上传按parser丢弃/关闭。
        guard先于control满503，不泄露loaded/busy；错误image_index为null且不回显秘密。
        原生JSON/早拒绝/noContinue/无宽松CORS仅适用于匹配管理state handler；畸形framing可在callback前失败，畸形Host也可改写为未匹配通用route。实测Host尾随斜杠GET通用404 HTML/CORS/keepalive，POST Expect先通用100 Continue、正文后最终通用HTTP错误；非管理授权，无Stats/Unload/model/cache管理执行。
      security:
        - ManagementBearerAuth: []
      requestBody:
        required: true
        x-max-body-bytes: 65536
        content:
          application/json:
            schema:
              type: object
              required: [kind, model]
              properties:
                kind:
                  type: string
                  enum: [yolo, ocr, seg, pose, obb]
                model:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: 模型已卸载
          content:
            application/json:
              schema:
                type: object
                required: [kind, model, unloaded]
                properties:
                  kind:
                    type: string
                    enum: [yolo, ocr, seg, pose, obb]
                  model:
                    type: string
                  unloaded:
                    type: boolean
                    enum: [true]
        '401': {$ref: '#/components/responses/ManagementUnauthorized'}
        '403': {$ref: '#/components/responses/ManagementForbidden'}
        '417': {$ref: '#/components/responses/ManagementExpectation'}
        '503': {$ref: '#/components/responses/ManagementOverloaded'}
        '413': {$ref: '#/components/responses/ManagementBodyLimit'}
        '415': {$ref: '#/components/responses/ManagementMedia'}
        '400':
          description: invalid_request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferError'
        '404':
          description: model_not_loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferError'
        '409':
          description: model_busy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferError'
        '500':
          description: internal_error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferError'
  /v0/infer/stats:
    get:
      summary: 查看已加载实例状态
      description: >-
        按 kind/name 排序的瞬时分页快照。加载/卸载时各页可能变化。
        实例计数在重新加载后重置；加载前的错误不计入实例。
        总耗时为已结束请求的毫秒数，包含等待 Run 的时间。
        无正文。管理默认关闭；启用、bearer及可信Host/Origin策略与unload相同。
        headers完成先guard，后control接纳/分页解析/cache；OPTIONS403，不使用宽松CORS。
        同unload：仅匹配管理state handler有原生guard契约；畸形Host可改写到通用route并保留库HTTP错误/nonJSON/CORS，POST Expect甚至可先通用100 Continue；无Stats/Unload/cache管理执行。
      security:
        - ManagementBearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: 当前模型缓存状态
          content:
            application/json:
              schema:
                type: object
                required: [models, total, limit, offset, idle_timeout_ms, image_budget]
                properties:
                  total:
                    type: integer
                    minimum: 0
                  limit:
                    type: integer
                  offset:
                    type: integer
                  idle_timeout_ms:
                    type: integer
                    description: 空闲自动卸载阈值；0 表示禁用
                  image_budget:
                    type: object
                    description: 服务级BGR输入预算计数，不随模型卸载重置；退款等待物理执行和输入析构
                    required: [in_use_bytes, peak_bytes, active_requests, decode_calls, rejected_requests]
                    properties:
                      in_use_bytes: {type: integer, format: int64, minimum: 0, description: 当前预留BGR输入字节}
                      peak_bytes: {type: integer, format: int64, minimum: 0, description: 服务启动以来预留字节峰值}
                      active_requests: {type: integer, minimum: 0, description: 持有请求credit的物理活动请求数}
                      decode_calls: {type: integer, format: int64, minimum: 0, description: 真实imdecode调用开始次数}
                      rejected_requests: {type: integer, format: int64, minimum: 0, description: 单图/批次/全局/credit预算拒绝请求数}
                  models:
                    type: array
                    maxItems: 200
                    items:
                      type: object
                      required: [kind, name, active_requests, requests, failures, total_duration_ms, last_used]
                      properties:
                        kind:
                          type: string
                          enum: [yolo, ocr, seg, pose, obb]
                        name:
                          type: string
                        active_requests:
                          type: integer
                          minimum: 0
                        requests:
                          type: integer
                          description: 已获得实例租约的请求数（含活动请求）
                        failures:
                          type: integer
                        total_duration_ms:
                          type: number
                        last_used:
                          type: integer
                          format: int64
                          description: 上次请求完成的 Unix 毫秒；未完成过请求时为加载时间
        '401': {$ref: '#/components/responses/ManagementUnauthorized'}
        '403': {$ref: '#/components/responses/ManagementForbidden'}
        '417': {$ref: '#/components/responses/ManagementExpectation'}
        '503': {$ref: '#/components/responses/ManagementOverloaded'}
        '400':
          description: invalid_request（分页参数或无正文策略无效）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferError'
        '500':
          description: internal_error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferError'
  /v1/infer/{task}:
    post:
      summary: 原生注册任务推理
      description: >-
        使用未限定的 model 名称；task 决定任务类型。整批原子成功，results 与 images 等长同序，
        无目标为该图的空数组；空批次允许。响应由 task 决定；空 results 可能匹配多个结构，
        因此使用 anyOf。所选任务下未配置的模型返回 404 unknown_model，空批次也如此。
        confidence/nms_iou 仅适用于 yolo/seg/pose/obb；ocr 使用 InferOCRRequest，显式任一控制返回
        400 invalid_request。控制校验先于模型查找/图片解码（含空批次），不改变 transport/取消/截止时间/关闭优先级。
        v0 的 yolo/ocr 路由及结果不变（unknown_model 仍为 400），不新增 v0 seg/pose/obb 路由。
        正文上限 64 MiB（包括分块传输），要求 application/json。
        Expect 仅接受 100-continue，其他期望返回 417。
      security: []
      parameters:
        - name: task
          in: path
          required: true
          schema: {type: string, enum: [yolo, ocr, seg, pose, obb]}
      requestBody:
        required: true
        x-max-body-bytes: 67108864
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InferYOLORequest'}
      responses:
        '200':
          description: 对应 task 的完整批次结果
          content:
            application/json:
              schema:
                anyOf:
                  - {$ref: '#/components/schemas/InferYOLOResponse'}
                  - {$ref: '#/components/schemas/InferOCRResponse'}
                  - {$ref: '#/components/schemas/InferSegmentationResponse'}
                  - {$ref: '#/components/schemas/InferPoseResponse'}
                  - {$ref: '#/components/schemas/InferOBBResponse'}
        '400': &native_error
          description: invalid_request、invalid_image 或 image_limit_exceeded；按 code 分支
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InferError'}
        '404':
          <<: *native_error
          description: unknown_model；所选任务下未配置的模型（包括模型仅配置在其他任务下），image_index 为 null；空批次也返回 404。
        '413':
          <<: *native_error
          description: request_too_large
        '415':
          <<: *native_error
          description: unsupported_media_type
        '417':
          <<: *native_error
          description: expectation_failed
        '500':
          <<: *native_error
          description: model_load_failed、model_config_failed、inference_failed 或 internal_error
        '503':
          <<: *native_error
          description: service_overloaded、request_cancelled 或 service_unavailable
        '504':
          <<: *native_error
          description: request_timeout
  /v1/tracking/sessions:
    description: >-
      与推理分离的有状态跟踪服务，调用方提供检测结果；不自动运行检测模型。
      无内建认证，仅供可信网络或鉴权代理使用。所有跟踪响应带 Cache-Control: no-store。
      所有路由拒绝非空 Origin（403）；仅支持 Expect: 100-continue，其他值返回 417。
      POST 必须使用精确的 Content-Type: application/json，正文最多 4194304 字节（含分块传输）；
      GET/DELETE 不接受正文或 Transfer-Encoding。协议校验失败为 invalid_request，
      超限为 413；POST 非法 Content-Length 也为 413，GET/DELETE 非法长度为 400。
    post:
      summary: 创建独立跟踪流
      description: 最多32会话；创建或最后一次成功 frames/reset 后闲置300秒可被清理。读取和列表不续期。
      security: []
      requestBody:
        required: true
        x-max-body-bytes: 4194304
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TrackingCreateRequest'}
      responses:
        '201':
          description: 已创建；初始时间字段为 null，计数为0
          headers:
            Location: {schema: {type: string}, description: 新会话的相对资源地址}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrackingSession'}
        '400': {$ref: '#/components/responses/TrackingInvalid'}
        '403': {$ref: '#/components/responses/TrackingOrigin'}
        '413': {$ref: '#/components/responses/TrackingBodyLimit'}
        '417': {$ref: '#/components/responses/TrackingExpectation'}
        '500': {$ref: '#/components/responses/TrackingFailed'}
        '503': {$ref: '#/components/responses/TrackingUnavailable'}
    get:
      summary: 按会话 ID 字典序分页
      description: 无正文。瞬时目录，跨页可能发生创建、删除或过期。
      security: []
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 100}
        - name: cursor
          in: query
          description: 传回 next_cursor；空字符串表示从头开始
          schema: {type: string, pattern: '^(t1\.[0-9a-f]{32})?$'}
      responses:
        '200':
          description: 会话 ID 页；无后续页时 next_cursor 为 null
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrackingSessionPage'}
        '400': {$ref: '#/components/responses/TrackingInvalid'}
        '403': {$ref: '#/components/responses/TrackingOrigin'}
        '417': {$ref: '#/components/responses/TrackingExpectation'}
        '500': {$ref: '#/components/responses/TrackingFailed'}
        '503': {$ref: '#/components/responses/TrackingUnavailable'}
  /v1/tracking/sessions/{id}:
    parameters:
