        整批成功或整批失败。按请求校验、模型查找/加载、控制检查、请求credit、header预检、
        全局字节预留、全部图片解码、有界流水线推理、序列化的顺序处理。
        HTTP 200 的 results 长度与 images 相同且顺序一致；每张图片对应的结果数组可为空。
        有效模型允许 images 为空数组。错误响应不含部分结果。
